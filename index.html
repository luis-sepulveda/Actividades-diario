<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividades — módulo por mes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MODULO POR MES
   Se entra por la portada de meses, se elige uno y ahi aparece
   el detalle: dias, estados y el desglose por tipo de actividad.
   Lee los mismos archivos que el dashboard: datos.json al lado
   e historico_dias.json del repo de rutas.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f8; --panel:#fff; --panel2:#eef2f6; --zebra:#f8fafc;
  --linea:#dbe3ec; --linea2:#b9c6d4;
  --ink:#16232f; --tenue:#5f7386; --debil:#93a3b4;
  --ok:#0f766e; --mal:#be123c; --ojo:#b45309; --frio:#4f46e5; --gris:#64748b;
  --amarillo:#facc15; --amarillo2:#a16207;
  --relieve:0 1px 2px rgba(20,45,70,.06);
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;
     padding:22px 20px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--tenue);margin-top:2px}
.cab{margin-bottom:20px}

.btn{background:var(--panel);border:1px solid var(--linea);color:var(--ink);
     padding:7px 15px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--linea2)}
.chip{background:var(--panel2);border:1px solid var(--linea);color:var(--tenue);
      padding:5px 13px;border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--linea2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}

/* ---- portada de meses ---- */
.meses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mes{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:22px 24px;
     cursor:pointer;box-shadow:var(--relieve);transition:.15s}
.mes:hover{border-color:var(--linea2);transform:translateY(-2px)}
.mes .nom{font-size:20px;font-weight:700;text-transform:capitalize}
.mes .curso{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;
            background:#fef3c7;color:#92400e;margin-left:8px;vertical-align:2px}
.mes .grande{font-size:44px;font-weight:700;line-height:1.05;margin:12px 0 2px}
.mes .bajo{font-size:13px;color:var(--tenue)}
.mes .mini{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
.mes .mini div .n{font-size:17px;font-weight:700}
.mes .mini div .l{font-size:11.5px;color:var(--tenue)}
.mes .ir{font-size:12.5px;color:var(--frio);margin-top:14px}

/* enlaces a las otras vistas del mismo repo */
.otras{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px;padding-top:18px;
       border-top:1px solid var(--linea)}
.otras a{background:var(--panel);border:1px solid var(--linea);border-radius:999px;
         padding:8px 16px;font-size:13px;color:var(--ink);text-decoration:none}
.otras a:hover{border-color:var(--linea2)}
.otras .et{font-size:12px;color:var(--debil);align-self:center;margin-right:4px}

/* ---- detalle del mes ---- */
.fila-f{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fila-f .et{font-size:11px;color:var(--debil);text-transform:uppercase;letter-spacing:.8px;
            margin-right:4px}
.estados{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.est{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea);
     border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--relieve);transition:.15s}
.est:hover{border-color:var(--linea2)}
.est.on{border-color:var(--ink);border-left-color:var(--ink);box-shadow:0 0 0 2px rgba(22,35,47,.08)}
.est .n{font-size:30px;font-weight:700;line-height:1}
.est .l{font-size:12.5px;color:var(--tenue);margin-top:3px}
.est .p{font-size:12px;color:var(--debil);margin-top:1px}
.est.comp{border-left-color:var(--ok)} .est.comp .n{color:var(--ok)}
.est.nore{border-left-color:var(--mal)} .est.nore .n{color:var(--mal)}
.est.canc{border-left-color:var(--ojo)} .est.canc .n{color:var(--ojo)}
.est.susp{border-left-color:var(--gris)} .est.susp .n{color:var(--gris)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
      padding:15px 18px;box-shadow:var(--relieve);margin-bottom:14px}
.caja h2{font-size:13.5px;font-weight:700;margin-bottom:12px}
.caja h2 .chico{font-weight:400;color:var(--tenue);font-size:12px;margin-left:6px}

.lin{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--linea)}
.lin:last-child{border-bottom:0}
.lin .nm{width:180px;font-size:13px;flex-shrink:0}
.lin .pista{flex:1;height:15px;background:var(--panel2);border-radius:4px}
.lin .pista span{display:block;height:100%;border-radius:4px;background:var(--frio)}
.lin .vl{width:52px;text-align:right;font-size:13px;font-weight:700}
.lin .pc{width:48px;text-align:right;font-size:12px;color:var(--debil)}
.vacio{font-size:13px;color:var(--debil);padding:10px 0}
.lin.abrir{cursor:pointer}
.lin.abrir:hover .nm{color:var(--ink)}
.lin.abrir .nm::after{content:' ▾';font-size:10px}
.lin.abrir.abierta .nm::after{content:' ▴'}
.lin.hija{padding-left:16px;border-bottom:1px dashed var(--linea)}
.lin.hija .nm{width:164px;font-size:12.5px;color:var(--tenue)}

.rutas{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.rutas .r{background:var(--panel2);border-radius:9px;padding:9px 11px}
.rutas .r .n{font-size:20px;font-weight:700;line-height:1.1}
.rutas .r .l{font-size:11px;color:var(--tenue);margin-top:2px}
.rutas .r.caida .n{color:var(--mal)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1 id="titulo">Actividades</h1>
    <div class="sub" id="subtitulo">Cargando…</div>
  </div>
  <div id="vista"></div>
</div>

<script>
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
const ESTADOS = [
  {k:'Completado',   cl:'comp', l:'Completadas',  c:'var(--ok)'},
  {k:'No Realizada', cl:'nore', l:'No realizadas', c:'var(--mal)'},
  {k:'Cancelado',    cl:'canc', l:'Canceladas',   c:'var(--ojo)'},
  {k:'Suspendido',   cl:'susp', l:'Suspendidas',  c:'var(--gris)'}
];
let FILAS = [], RUTAS = {}, mesSel = null, diaSel = null, estSel = 'Completado';

/* Etiqueta con la que se muestra cada actividad.
   Las altas, migraciones y traslados se abren en 1P, 2P y 3P.
   Las reparaciones NO: cuentan como una unidad y van en su propia fila,
   igual que en el dashboard de historial por tecnico. */
function categoria(r){
  const t = String(r['Tipo de Actividad'] || '').trim();
  const T = t.toUpperCase();
  if(T.indexOf('REPARAC') === 0) return t;
  const p = parseInt(r['Play'], 10);
  if(p >= 1 && p <= 3 && (T.indexOf('ALTA') === 0 || T.indexOf('MIGRAC') === 0))
    return t + ' ' + p + 'P';
  return t;
}

function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function pc(a,b){ return b ? (Math.round(1000*a/b)/10).toFixed(1).replace('.',',')+'%' : '—'; }

function expandir(j){
  const dic = j.dic || {};
  return j.rows.map(r => { const o = {};
    j.cols.forEach((c,i) => o[c] = dic[c] ? dic[c][r[i]] : r[i]); return o; });
}
/* las fechas vienen dd-mm-aaaa */
function partes(f){ const p = String(f||'').split('-'); return p.length===3 ? p : null; }
function claveMes(f){ const p = partes(f); return p ? p[2]+'-'+p[1] : null; }
function nombreMes(k){ const p = k.split('-'); return MES[+p[1]-1]+' '+p[0]; }
function ordenDia(f){ const p = partes(f); return p ? p[2]+p[1]+p[0] : ''; }

async function cargar(){
  try{
    const r = await fetch('datos.json?t='+Date.now(), {cache:'no-store'});
    FILAS = expandir(await r.json());
  }catch(e){
    document.getElementById('subtitulo').textContent =
      'No se pudo cargar datos.json. Tiene que estar en la misma carpeta.';
    return;
  }
  try{
    const r = await fetch('https://raw.githubusercontent.com/luis-sepulveda/Rutas-tecnicos/data/historico_dias.json?t='+Date.now(), {cache:'no-store'});
    RUTAS = (await r.json()).dias || {};
  }catch(e){ RUTAS = {}; }
  portada();
}

/* ================= PORTADA ================= */
function portada(){
  mesSel = null; diaSel = null;
  document.getElementById('titulo').textContent = 'Actividades';
  const meses = [...new Set(FILAS.map(r => claveMes(r['Fecha'])).filter(Boolean))].sort();
  document.getElementById('subtitulo').textContent =
    'VTR y Claro · Región de Valparaíso · ' + meses.length + (meses.length===1?' mes cargado':' meses cargados');

  const hoy = new Date();
  const kHoy = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');

  let h = '<div class="meses">';
  meses.forEach(k => {
    const l = FILAS.filter(r => claveMes(r['Fecha']) === k);
    const comp = l.filter(r => r['Estado']==='Completado').length;
    const nore = l.filter(r => r['Estado']==='No Realizada').length;
    const dias = new Set(l.map(r => r['Fecha'])).size;
    h += '<div class="mes" data-m="'+k+'">'
      + '<div class="nom">'+nombreMes(k)+(k===kHoy?'<span class="curso">en curso</span>':'')+'</div>'
      + '<div class="grande">'+pc(comp,l.length)+'</div>'
      + '<div class="bajo">completadas · '+l.length.toLocaleString('es-CL')+' actividades</div>'
      + '<div class="mini">'
      +   '<div><div class="n" style="color:var(--ok)">'+comp.toLocaleString('es-CL')+'</div><div class="l">completadas</div></div>'
      +   '<div><div class="n" style="color:var(--mal)">'+nore.toLocaleString('es-CL')+'</div><div class="l">no realizadas</div></div>'
      +   '<div><div class="n">'+dias+'</div><div class="l">días</div></div>'
      + '</div><div class="ir">Ver el detalle →</div></div>';
  });
  h += '</div>'
    + '<div class="otras"><span class="et">También:</span>'
    + '<a href="dashboard.html">Dashboard completo</a>'
    + '<a href="pantalla.html">Vista de pantalla</a>'
    + '</div>';
  document.getElementById('vista').innerHTML = h;
  document.querySelectorAll('.mes').forEach(e =>
    e.addEventListener('click', () => { mesSel = e.dataset.m; diaSel = null; estSel = 'Completado'; verMes(); }));
}

/* ================= DETALLE DEL MES ================= */
function activas(){
  let l = FILAS.filter(r => claveMes(r['Fecha']) === mesSel);
  if(diaSel) l = l.filter(r => r['Fecha'] === diaSel);
  return l;
}

function verMes(){
  document.getElementById('titulo').textContent = nombreMes(mesSel).replace(/^./, c => c.toUpperCase());
  const todas = activas();
  document.getElementById('subtitulo').textContent =
    todas.length.toLocaleString('es-CL') + ' actividades' + (diaSel ? ' · '+diaSel : ' · todo el mes');

  const dias = [...new Set(FILAS.filter(r => claveMes(r['Fecha'])===mesSel).map(r => r['Fecha']))]
               .sort((a,b) => ordenDia(a).localeCompare(ordenDia(b)));

  let h = '<div class="fila-f"><button class="btn" id="volver">← Meses</button></div>'
        + '<div class="fila-f"><span class="et">Día</span>'
        + '<button class="chip'+(!diaSel?' on':'')+'" data-d="">Todo el mes</button>';
  dias.forEach(d => h += '<button class="chip'+(diaSel===d?' on':'')+'" data-d="'+d+'">'+d.slice(0,5)+'</button>');
  h += '</div><div class="estados">';

  ESTADOS.forEach(e => {
    const n = todas.filter(r => r['Estado']===e.k).length;
    h += '<div class="est '+e.cl+(estSel===e.k?' on':'')+'" data-e="'+e.k+'">'
      + '<div class="n">'+n.toLocaleString('es-CL')+'</div><div class="l">'+e.l+'</div>'
      + '<div class="p">'+pc(n,todas.length)+' del total</div></div>';
  });
  h += '</div>';

  /* --- desglose del estado elegido --- */
  const sel = todas.filter(r => r['Estado']===estSel);
  const et = ESTADOS.find(e => e.k===estSel);
  h += '<div class="grid2">';
  h += '<div class="caja"><h2>'+et.l+' por tipo de actividad'
     + '<span class="chico">'+sel.length.toLocaleString('es-CL')+' órdenes</span></h2>'
     + barras(sel, categoria) + '</div>';

  if(estSel === 'No Realizada' || estSel === 'Cancelado'){
    h += '<div class="caja"><h2>Motivo de cierre'
       + '<span class="chico">las más relevantes</span></h2>'
       + barras(sel, 'Código de Cierre', null, true) + '</div>';
  } else {
    h += '<div class="caja"><h2>Por ciudad</h2>' + barras(sel, 'Ciudad', 6) + '</div>';
  }
  h += '</div>';

  h += '<div class="grid2"><div class="caja"><h2>Por supervisor</h2>'
     + barras(sel, 'supervisor') + '</div>'
     + '<div class="caja"><h2>Por franja horaria</h2>' + barras(sel, 'Franja') + '</div></div>';

  /* --- lo que paso en rutas --- */
  h += '<div class="caja"><h2>Monitor de rutas'
     + (diaSel ? '<span class="chico">'+diaSel+'</span>' : '<span class="chico">elige un día</span>')
     + '</h2>' + panelRutas() + '</div>';

  document.getElementById('vista').innerHTML = h;
  document.getElementById('volver').addEventListener('click', portada);
  document.querySelectorAll('.lin.abrir').forEach(f =>
    f.addEventListener('click', () => {
      const caja = document.getElementById(f.dataset.abre);
      const abierta = caja.style.display !== 'none';
      caja.style.display = abierta ? 'none' : 'block';
      f.classList.toggle('abierta', !abierta);
    }));
  document.querySelectorAll('.chip[data-d]').forEach(b =>
    b.addEventListener('click', () => { diaSel = b.dataset.d || null; verMes(); }));
  document.querySelectorAll('.est').forEach(b =>
    b.addEventListener('click', () => { estSel = b.dataset.e; verMes(); }));
  window.scrollTo(0,0);
}

/* Motivos que siempre se muestran aunque tengan pocas ordenes: son los que
   se miran si o si. La falta de dotacion ademas sale en amarillo, porque no
   es una falla del tecnico sino que no hubo quien la tomara. */
const CIERRES_CLAVE = ['sin moradores','cliente reagenda','cliente desiste','dotaci'];
/* Un motivo entra si pesa al menos este porcentaje del total. Con 5 salian
   17 filas y eso ya no es "lo relevante". Si quieres ver mas, baja el numero. */
const MINIMO_CIERRE = 2;

let _nOtras = 0;
function barras(lista, campo, tope, relevantes){
  const col = (ESTADOS.find(e => e.k === estSel) || {}).c || 'var(--frio)';
  if(!lista.length) return '<div class="vacio">Sin órdenes en esta selección.</div>';
  const c = {};
  const sacar = typeof campo === 'function' ? campo : (r => r[campo]);
  lista.forEach(r => { const v = sacar(r) || 'Sin dato'; c[v] = (c[v]||0)+1; });
  let pares = Object.entries(c).sort((a,b) => b[1]-a[1]);
  let otras = [];
  if(relevantes){
    /* se muestran los motivos con peso propio y los que siempre importan;
       el resto se junta al final para no perder el total */
    const vale = ([k,v]) => (100*v/lista.length) >= MINIMO_CIERRE ||
      CIERRES_CLAVE.some(p => String(k).toLowerCase().indexOf(p) >= 0);
    otras = pares.filter(x => !vale(x));
    pares = pares.filter(vale);
  } else if(tope && pares.length > tope){
    otras = pares.slice(tope);
    pares = pares.slice(0, tope);
  }
  if(!pares.length){ pares = otras; otras = []; }
  const max = pares[0][1];
  let h = '';
  pares.forEach(([k,v]) => {
    const dotacion = String(k).toLowerCase().indexOf('dotaci') >= 0;
    h += '<div class="lin"><span class="nm"'
      + (dotacion ? ' style="color:var(--amarillo2);font-weight:700"' : '')+'>'+esc(k)+'</span>'
      + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:'
      + (dotacion ? 'var(--amarillo)' : col)+'"></span></div>'
      + '<span class="vl">'+v.toLocaleString('es-CL')+'</span>'
      + '<span class="pc">'+pc(v,lista.length)+'</span></div>';
  });
  if(otras.length){
    const s = otras.reduce((a,b) => a+b[1], 0);
    const id = 'otras'+(++_nOtras);
    h += '<div class="lin abrir" data-abre="'+id+'">'
      + '<span class="nm" style="color:var(--debil)">Otras '+otras.length+'</span>'
      + '<div class="pista"><span style="width:'+(100*s/max)+'%;background:var(--debil)"></span></div>'
      + '<span class="vl">'+s+'</span><span class="pc">'+pc(s,lista.length)+'</span></div>'
      + '<div id="'+id+'" style="display:none">';
    otras.forEach(([k,v]) => {
      h += '<div class="lin hija"><span class="nm">'+esc(k)+'</span>'
        + '<div class="pista"><span style="width:'+(100*v/max)+'%;background:var(--debil)"></span></div>'
        + '<span class="vl">'+v+'</span><span class="pc">'+pc(v,lista.length)+'</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function panelRutas(){
  if(!diaSel) return '<div class="vacio">Elige un día arriba para ver las caídas y las órdenes nuevas de esa jornada.</div>';
  const d = RUTAS[diaSel];
  if(!d) return '<div class="vacio">El monitor no tiene registro de este día. Empezó a guardar el 05-09-2026.</div>';
  const r = (v,l,cl) => '<div class="r '+(cl||'')+'"><div class="n">'+(v??0)+'</div><div class="l">'+l+'</div></div>';
  return '<div class="rutas">'
    + r(d.caidas_total,'caídas','caida') + r(d.caidas_activas,'sin resolver','caida')
    + r(d.caidas_resueltas,'resueltas') + r(d.nuevas,'órdenes nuevas')
    + r(d.al_bucket,'al bucket') + r(d.repetidas,'repetidas')
    + r(d.reagendadas,'reagendadas') + r(d.rgu,'RGU')
    + '</div><div class="vacio">Corte de las '+d.hasta+' · '+d.actividades+' actividades · '+d.tecnicos+' técnicos</div>';
}

cargar();
</script>
</body>
</html>
